# Пример словаря словечек (CLAUDE.md, "словечки из словаря").
# Загрузить: отправь такой файл боту в личку с подписью /words. Файл с тем же name
# заменяет старый словарь. Свои словари в репозиторий не кладём: они живут в БД бота.
name: пример
about: словечки, которые ты привёз из дома       # одна строка для модели: откуда слова
words:
  - word: айда                                  # ударение можно ставить: а́йда
    meaning: пошли, давай, зов куда-то пойти
    example: Айда на рынок, пока не жарко.
  - word: гомонок
    meaning: кошелёк
    example: Гомонок дома забыл.
  - word: мастерка
    meaning: спортивная куртка, олимпийка
    forms: [мастерка, мастерку, мастерке, мастеркой]   # необязательно: только эти формы
