# Окрестности — «куда съездить и посидеть», не выпить (CHARACTER.md, раздел 7).
# Google не вернёт эти три записи по названию: имя ниже — заглушка на район,
# а не название конкретного заведения. ДОБИТЬ РУКАМИ — после первого прогона
# places_fill.py по запросам "restauracja Kórnik"/"Puszczykowo bar" найти
# реальные заведения в каждом районе и заменить name на их фактическое
# название (и убрать эту запись-заглушку, если она больше не нужна).

# ДОБИТЬ РУКАМИ: заменить на реальное заведение в Kórniku.
- name: Kórnik
  quiet: true
  category: outskirts
  district: Kórnik

