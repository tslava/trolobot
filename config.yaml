persona:
  name: Фёдор
  display_name: Отец Фёдор     # имя профиля в Telegram
  name_triggers: [фёдор, федор, федя, федь, отец, отче, батюшка, дед]  # обращение без @
  birth_date: 1974-04-12      # возраст считается на лету, стареет вместе с чатом
  arrived_poznan: 2006
  district: Wilda             # уточнить, он будет его защищать
  timezone: Europe/Warsaw

behaviour:
  quiet_window: ["02:00", "07:00"]     # полная тишина, включая прямые обращения
  morning_reply_window: ["07:00", "08:00"]  # одна реплика всем, кто звал ночью; момент случайный внутри окна

  # ambient — сам заговаривает, только в живой разговор
  live_talk:                           # что считается живым разговором
    min_messages: 3
    min_people: 2
    window_min: 10
  ambient_probability: 0.15            # шанс на сообщение внутри живого разговора
  chat_cooldown_min: 25                # между ambient-репликами
  daily_cap: 3                         # ambient и «просто так» вместе, в сутки; сутки по timezone

  # просто так — пишет сам, без повода, когда в чате тихо
  spontaneous:
    per_week: 2
    window: ["10:00", "22:00"]
    min_quiet_hours: 3                 # никто не писал столько часов

  # реакции-эмодзи вместо молчания на срез гейта по кубику (gate:dice/gate:ambient_cooldown);
  # без нового сообщения — только setMessageReaction, эффект присутствия.
  # Сначала пауза (человек читает, а не лайкает за 0,3 секунды), потом дешёвая модель
  # решает, уместна ли реакция и какая; кубик остаётся только при semantic: false
  reactions:
    enabled: true
    probability: 0.2                   # шанс реакции; работает только при semantic: false
    cooldown_min: 60                   # не чаще одного раза в час
    daily_cap: 8                       # в сутки, отдельно от ambient/mention
    emoji: ["👍", "💩", "😂"]            # только из filters.allowed_emoji; 💩 в этом чате значит «одобряю»
    delay_sec: [20, 120]               # пауза перед реакцией: прочитал и хмыкнул
    semantic: true                     # реакцию выбирает модель; false — прежний кубик
    model: ""                          # пусто -> llm.judge_model (та же дешёвая модель, что судья)
    max_tokens: 40
    semantic_daily_cap: 40             # вызовов модели на реакции в сутки, счётчик reaction_calls
    context_messages: 6                # сколько последних сообщений чата показать модели

  # стикеры вместо текста — второй, дешёвый вызов модели уже над готовым (прошедшим
  # выходной фильтр) текстом и каталогом (stickers.yaml); в основной промпт каталог
  # не подмешивается никогда (дороже основной запрос не нужен, скорость не важна)
  stickers:
    enabled: true
    min_replies_between: 4             # сколько текстовых реплик должно пройти после стикера
    daily_cap: 1                       # не больше одного стикера в день (решение владельца)
    recent_window: 10                  # столько последних использованных стикеров не повторять
    model: ""                          # пусто -> llm.judge_model (та же дешёвая модель, что судья)
    max_tokens: 60

  # горячее окно после /life и /say: после того как бот сам вбросил новость или реплику,
  # полчаса отвечает живее обычного; вне окна поведение не меняется ни на шаг
  hot_window:
    enabled: true
    minutes: 10                        # длительность окна после /life и /say
    mention_max_delay_sec: 120         # потолок задержки ответа на обращение в окне
    ambient_probability: 0.5           # вместо behaviour.ambient_probability, пока окно открыто
    ambient_cap: 8                     # ambient-реплик за одно окно, отдельно от daily_cap
    open_on_any_reply: false           # true — окно после любой реплики (было так до стопа 15.09)

  # дешёвая проверка «это мне или про мою тему?» для сообщений без обращения, только
  # пока открыто горячее окно (CLAUDE.md, "внимание как у живого человека")
  followup:
    enabled: true
    model: ""                          # пусто -> llm.judge_model
    max_tokens: 60
    daily_cap: 300                     # вызовов проверки в сутки, свой счётчик — не съедает бюджет основной модели
    context_messages: 10               # сообщений чата дать проверке
    recent_replies: 3                  # последних реплик Фёдора дать проверке

  # «вернулся проверить» — раз в 2-4 часа после закрытия горячего окна один вызов основной
  # модели по всему, что написали после последней реплики персонажа (не путать с followup —
  # там окно ещё открыто и проверка дешёвой моделью; здесь окно уже закрылось)
  checkin:
    enabled: true
    after_min: [120, 240]              # минут после закрытия окна до проверки
    topic_max_hours: 48                # без реплик бота дольше — тема умерла, проверок нет
    max_messages: 40                   # сколько сообщений после последней реплики брать
    poll_sec: 300                      # период фонового цикла
    quiet_min: 10                      # минут тишины в чате; писали позже — отложить проверку
    prefilter: true                    # дешёвая проверка пачки перед основной моделью — есть ли что Фёдору
    prefilter_max_tokens: 60           # лимит токенов ответа дешёвого предфильтра

  # потолок присутствия: за локальные сутки бот говорит не больше своей доли от того, сколько
  # написали люди. Под потолком проходят только реплаи на самого бота, /life и /say — всё
  # остальное (имя, @, ambient, «просто так», утро, «вернулся проверить») молчит до завтра
  presence:
    enabled: true
    max_share: 0.15                    # доля реплик бота от сообщений людей за сутки
    free_replies: 2                    # реплик сверх доли: чтобы утром в пустом чате не молчал

  # долгая память чата: сообщения живут message_retention_days, а бот должен помнить, о чём
  # говорили месяцы назад — раз в неделю модель сжимает период в несколько строк, пересказ
  # хранится дольше самих сообщений и подмешивается в системный промпт (сообщения замьютенных
  # участников в пересказ не попадают вовсе)
  chat_memory:
    enabled: true
    period_days: 7                     # шаг пересказа: одна неделя
    run_window: ["04:00", "06:00"]     # когда крутить пересказ; ночью чат всё равно спит
    in_prompt: 8                       # последних пересказов в промпт (~два месяца)
    keep_days: 365                     # хранить пересказы год, потом чистит ретеншн
    max_messages: 600                  # сообщений на один вызов, берутся последние
    max_chars: 700                     # потолок длины пересказа
    max_tokens: 400
    model: ""                          # пусто -> llm.main_model
    backfill_periods: 4                # сколько прошлых недель догнать при первом запуске

  # зрение на фото: снимок описывается моделью со зрением, описание становится текстом
  # сообщения («[фото: ...]») и дальше живёт как обычный текст (CLAUDE.md, "зрение на фото")
  vision:
    enabled: true
    model: ""                          # пусто -> llm.main_model (она уже со зрением)
    max_tokens: 120
    daily_cap: 20                      # описаний в сутки, свой счётчик vision_calls
    ambient_probability: 0.3           # шанс описать фото без повода (не обращение, не горячее окно)
    max_width: 1024                    # берём самый большой размер не шире этого, px
    max_chars: 200                     # потолок длины описания

  # погода фоном в системном промпте (Open-Meteo, публичный API без ключа). Координат
  # домашней точки здесь НЕТ намеренно: репозиторий публичный, широта/долгота/название
  # живут в .env (WEATHER_LATITUDE / WEATHER_LONGITUDE / WEATHER_HOME_NAME). Не заданы —
  # блок «за окном» пуст, а погода по месту из вопроса всё равно работает
  weather:
    enabled: true
    ttl_min: 30                        # сколько ответ считается свежим, минут
    timeout_sec: 5
    place_lookup: true                 # «а в Варшаве?» — погода по месту из вопроса
    lookup_model: ""                   # пусто -> llm.judge_model
    lookup_max_tokens: 40
    lookup_daily_cap: 30               # вызовов в сутки, свой счётчик weather_calls
    geocode_ttl_days: 30               # сколько помнить координаты найденного места

  # прямые обращения — отдельный бюджет; кулдаун = задержка, не отказ (сдвигает due_at, не отбрасывает)
  mention_cooldown_sec: 60             # на человека
  mention_chat_cooldown_sec: 90        # на чат
  mention_daily_cap: 50                # обращений в сутки, сверх — молчит; пока ребята наигрываются, потом снизить
  reply_as_reply_after_sec: 300        # реплаем, если прошло больше или писали другие
  min_gap_sec: 300                     # минимум между любыми двумя сообщениями бота; обращение не
                                       # отбрасывается, а переносится, неадресное — молчит

  debounce_sec: [3, 7]                 # копит очередь сообщений перед ответом
  reply_delay_buckets:                 # задержка ответа на обращение
    - {weight: 0.6, range_sec: [30, 180]}
    - {weight: 0.3, range_sec: [180, 900]}
    - {weight: 0.1, range_sec: [900, 3600]}
  urgent_max_delay_sec: 180            # если в сообщении «сегодня/сейчас/куда идём»
  late_reply_threshold_sec: 600        # свыше — можно отыграть паузу в реплике
  context_window: 30
  recent_replies_memory: 20
  topic_cooldown_min: 45               # после срабатывания стоп-листа на входе
  message_retention_days: 30           # messages и candidate_text старше — удаляются

llm:
  provider: openrouter                 # OpenAI-совместимый API, ключ в .env
  main_model: "anthropic/claude-opus-5"     # id модели в OpenRouter
  judge_model: "openai/gpt-5.4-nano"         # маленькая и дешёвая, другой вендор
  timeout_sec: 30
  max_tokens: 200
  # защита бюджета (плюс credit limit на самом ключе в кабинете OpenRouter — без него не выкатывать)
  daily_calls_cap: 150                 # попыток вызова в сутки, судья считается; ~55 основных + ~55 судьи ≈ 110, запас до 150
  daily_budget_usd: 2.0                # по usage.cost из ответа; худший день на Sonnet 5 ≈ 0.55$ + судья ≈ 0.02$; сверх — молчит до конца суток
  circuit_errors: 5                    # ошибок подряд → пауза
  circuit_pause_min: 30
  # fallback-цены за 1M токенов; используются, только если провайдер не вернул usage.cost
  price_in_usd_per_1m: 5.0
  price_out_usd_per_1m: 25.0

places:
  min_rating: 4.2
  min_reviews: 50          # НЕ 100 — порог отсекает как раз его места
  require_operational: true
  cache_ttl_days: 30       # раз в месяц перегнать скриптом наполнения
  max_per_reply: 2
  # запросы для офлайн-наполнения кэша (places_fill.py), можно переопределить --queries
  queries:
    - craft beer pub Poznań
    - cichy pub Poznań
    - piwo rzemieślnicze Poznań
    - pub Wilda Poznań
    - pub Jeżyce Poznań
    - kawiarnia planszówki Poznań
    - restauracja Kórnik
    - Puszczykowo bar

filters:
  shadow: true              # true = фильтры логируют, но не режут ответ (щадящий старт)
  places_whitelist: [Lidl, OLX, Biedronka, Żabka, Allegro]  # бытовые бренды, не заведения из раздела 7

  # разрешённые эмодзи (решение владельца, CHARACTER.md раздел 3/4) — небольшой набор,
  # редко и к месту; 💩 и 👍 в этом чате значат «одобряю» (💩 — локальная шутка)
  allowed_emoji: ["🙁", "🙂", "😂", "😀", "🤪", "💩", "👍"]
  emoji_max_per_reply: 1    # разрешённых эмодзи в одной реплике, больше — срез (style:emoji_count)
  emoji_recent_window: 4    # если эмодзи было хотя бы в одной из последних N реплик — новое режется (style:emoji_freq)

  # заведения из CHARACTER.md раздел 7 — белый список regex:venue/regex:latin;
  # многословные названия матчатся по каждому слову (LALKA продублирована отдельно —
  # в чате её зовут и полным именем, и коротким, см. few_shot.yaml)
  known_places:
    - Piwna Stopa
    - Dom Piwa
    - Deja Vu
    - Jeżycówka
    - Klubokawiarnia LALKA
    - LALKA
    - FARBY
    - Piwnica
    - Wściekły Chmiel
    - Lot Chmiela
    - BRO
    - Ministerstwo Browaru

  # польский словарь Фёдора (CHARACTER.md раздел 1) — белый список для regex:venue/
  # regex:latin; для dedup:polish_freq, наоборот, это и есть слова, чью частоту
  # правило ограничивает (раз в 5-6 реплик)
  polish_words:
    - działka
    - działki
    - działce
    - przegląd
    - urząd
    - urzędzie
    - sklep
    - piwo
    - zrobiony
    - mechanik
    - sąsiad
    - pomidory
    - garaż
    - grzyby
    - las
    - dobra
    - nie
    - tak
    - spoko
    - pan
    - pani
    - dziękuję
    - lech
    - tyskie
    - żywiec

  # стоп-лист тем (вход и выход), регулярки по границам слов, CHARACTER.md раздел 6.
  # "фронт работ" и "сектор газа" отдельно не ловятся — ложные срабатывания приняты осознанно.
  topic_stop:
    - \bвойн[а-я]*
    - \bукраин[а-я]*
    - \bросси[а-я]*
    - \bрф\b
    - \bобстрел[а-я]*
    - \bфронт[а-я]*
    - \bмобилизац[а-я]*
    - \bпутин[а-я]*
    - \bзеленск[а-я]*
    - \bтрамп(а|у|ом|е|ы)?\b
    - \bвыбор(ы|ов|ах|ам)\b
    - \bсанкци[а-я]*
    - \bпис\b
    - \bpis\b
    - \bтуск[а-я]*
    - \bконфедерац[а-я]*
    - \bмигрант[а-я]*
    - \bбеженц[а-я]*
    - \bизраил[а-я]*
    - \bпалестин[а-я]*
    - \bсектор газа
    - \bцерк[а-я]*
    - \bкостёл[а-я]*
    - \bкостел[а-я]*
    - \bаборт[а-я]*
    - \bлгбт\b
    - \bнациз[а-я]*
    - \bфашис[а-я]*

  # маркеры команд (входной гейт, шаг 5a) — узкий список, срабатывание глушит без кулдауна
  injection_markers:
    - "забудь (инструкции|правила|всё)"
    - \bигнорируй (все|всё|предыдущ\w*|инструкци\w*|правил\w*)\b
    - \bты теперь (бот|пират|ассистент|помощник|нейросеть|другой человек|другой персонаж|играешь роль)\b
    - системн\w+ промпт
    - повтори за мной
    - скажи дословно
    - напиши слово
    - "ignore (previous|all)"
    - как языковая модель
    - \bпредставь,? что ты\b
    - \bпритворись\b
    - \bиграй роль\b

  # логистический фильтр (этап 2, п.8): время, «кто идёт», «я пас» и т.д. — не мешать договорённостям
  logistics:
    - \b\d{1,2}[:.]\d{2}\b
    - \bв (семь|восемь|девять|десять|шесть|пять|четыре|три|два)\b(?! раз)
    - \bв час\b(?! пик)
    - \bво сколько\b
    - "\\bкто (идёт|идет|будет|со мной)\\b"
    - \bя пас\b
    - \bвстречаемся\b
    - "\\bгде (собираемся|встречаемся)\\b"
    - \bкто в (пн|вт|ср|чт|пт|сб|вс|понедельник|вторник|среду|четверг|пятницу|субботу|воскресенье|выходные)\b
    - \bподтянусь\b
    - \bбуду через\b

  # срочное — в быстрый бакет ответа (этап 3)
  urgent:
    - \bсегодня\b
    - \bсейчас\b
    - \bчерез час\b
    - \bкуда идём\b
    - \bкуда идем\b
    - \bты где\b

  # детект запроса про место (этап 5)
  places_request:
    - \bкуда сходить\b
    - \bпосоветуй
    - \bгде посидеть\b
    - \bгде выпить\b
    - \bкакой бар\b
    - \bпаб\b
    - \bпивнух
    - \bкуда съездить\b
    - \bгде (пиво|бар|паб|пивная|посидеть|выпить|нормальн\w+ пиво|вкусн\w+ пиво)
    - \bколись,? где\b
    - \bкуда (пойти|податься|зайти)\b
    - \bпосовет\w+ (бар|паб|место|куда)\b
    - \bкакой (бар|паб|пивняк)\b
    - \bесть (бар|паб|место)\b
    - \bпивняк\b

  # повод узнать погоду в названном месте (CLAUDE.md, "погода в другом месте"):
  # регулярка только включает дешёвый вызов, который достаёт название из текста,
  # решение «спрашивали ли про место» — за моделью
  weather_request:
    - \bпогод
    - \bдожд
    - \bснег
    - \bжар[аеуы]\b
    - \bupał
    - \bтемператур
    - \bградус
    - \bтепл[оаы]
    - \bхолодн

  # маркеры модели (выходной фильтр, этап 4) — он не знает этих слов
  model_talk:
    - языковая модель
    - нейросет\w*
    - инструкци\w*
    - промпт\w*
    - \bИИ\b
    - OpenAI
    - Anthropic
    - OpenRouter

  # сухие/раздражённые формулировки (style:grumpy, выходной фильтр) — добродушный
  # персонаж не отмахивается от вопросов и не злится на повторы (CHARACTER.md раздел 3)
  grumpy_markers:
    - \bя (же|уже|вам уже) (говорил|сказал|написал)\b
    - \bразговор закрыт\b
    - \bникому не интересно\b
    - \bне буду (говорить|рассказывать|отвечать)\b
    - \bнеинтересно\b
    - \bотстань
    - \bхватит (уже|про|об)
    - \bсколько можно\b

  # маркеры ассистента (выходной фильтр) — фразы, не регулярки; экранируются в Patterns
  assistant_markers:
    - важно отметить
    - стоит учесть
    - рекомендую
    - могу помочь
    - дай знать
    - надеюсь это поможет
    - во-первых
    - "конечно!"
    - отличный вопрос
    - если у тебя есть вопросы

  # стадии выходного фильтра, которые режут даже при shadow: true (CLAUDE.md,
  # «меньше и разнообразнее», мера 4) — повторы и сорванный стиль shadow пропускал,
  # и именно из-за них чат остановил бота 15.09
  enforce_stages: [dedup, style]

  # реквизит персонажа (мера 5): метка мотива -> регулярки, IGNORECASE, по границам слов.
  # 14.09 в 22 репликах жена встретилась 7 раз, теплица 5, гараж 5, «в девяносто пятом» 5.
  # Используется дважды: слот {avoid} в промпте (предупредить) и dedup:motif (срезать)
  motifs:
    жена: ['\bжен[аеуы]\b', '\bжено[йю]\b']
    теплица: ['\bтеплиц']
    гараж: ['\bгараж']
    девяностые: ['\bдевяност', '\b9\d-?[мхе]\b']
    двухтысячные: ['\bдвухтысячн']
    сын: ['\bсын']
    грибы: ['\bгриб']
    участок: ['\bучасток', '\bучастк']
    машина: ['\bмашин']
    зато: ['\bзато\b']
  motif_recent_window: 3    # мотив из последних N реплик в кандидате — срез (dedup:motif)
  motif_avoid_window: 10    # мотивы из последних N реплик уходят в промпт слотом {avoid}

  # квота баек (мера 5): байка не в каждом ответе, одна на несколько реплик
  story_markers:
    - \bдевяност
    - \bдвухтысячн
    - \bв прошлом году
    - \bлет назад
    - \bпомню\b
    - \bкогда-то\b
    - \bодин раз\b
    - \bкак-то раз\b
  story_window: 5           # окно последних реплик, в котором считаются байки
  story_max: 1              # больше баек в окне — срез style:story_quota и запрет в {avoid}
